name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-14-compatibility:
    name: Compatibility build (macOS 14, Xcode 16.2)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify vendored Ghostty runtime
        run: scripts/verify_ghostty_vendor.sh

      - name: Build deployment target
        run: |
          set -o pipefail
          xcodebuild \
            -project Liney.xcodeproj \
            -scheme Liney \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild-macos-14.log"

  build-and-test:
    name: Build and test (macOS 15, Xcode 26.3)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        # Xcode 16.4 only ships the macOS 15.5 SDK, while LineyTests targets
        # macOS 15.6. Pin a runner-installed Xcode 26 release so clean CI
        # builds use an SDK that supports the project's deployment target.
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Verify vendored Ghostty runtime
        run: scripts/verify_ghostty_vendor.sh

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Liney.xcodeproj \
            -scheme Liney \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/LineyTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LineyTests-xcresult
          path: ${{ runner.temp }}/LineyTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
